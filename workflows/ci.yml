name: PageGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pageguard-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # package-lock.json has not been committed yet, so use npm install.
      # Once a lockfile is committed, switch this to npm ci.
      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

      - name: Type-check and build web app
        run: npm run build
